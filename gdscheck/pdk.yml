# SPDX-License-Identifier: Apache-2.0

name: IHP SG13G2 FRIDA precheck
version: "1.0"

# A conservative block-level precheck of the metal stack, from the metal and via rules in
# pdk/ihp130/layout/tech.py (RULES), not a replacement for the foundry deck. gdscheck embeds the
# open PDK's full decks too: `gdscheck run -p ihp-sg13g2 -s core` (blocks; `main` adds density and
# antenna checks for a chip).
suites:
  - name: precheck
    path: suites/precheck.yml
    description: Grid, metal, via and enclosure checks

decks:
  - name: geometry
    path: decks/geometry.yml
    description: Minimum metal and via geometry
  - name: enclosure
    path: decks/enclosure.yml
    description: Via containment by adjacent metals
  - name: offgrid
    path: decks/offgrid.yml
    description: Manufacturing grid

layers:
  - name: Metal1
    gds_layer: 8
    gds_datatype: 0
  - name: Via1
    gds_layer: 19
    gds_datatype: 0
  - name: Metal2
    gds_layer: 10
    gds_datatype: 0
  - name: Via2
    gds_layer: 29
    gds_datatype: 0
  - name: Metal3
    gds_layer: 30
    gds_datatype: 0
  - name: Via3
    gds_layer: 49
    gds_datatype: 0
  - name: Metal4
    gds_layer: 50
    gds_datatype: 0
  - name: Via4
    gds_layer: 66
    gds_datatype: 0
  - name: Metal5
    gds_layer: 67
    gds_datatype: 0
  - name: Via5
    gds_layer: 125
    gds_datatype: 0
  - name: Metal6
    gds_layer: 126
    gds_datatype: 0
  - name: Via6
    gds_layer: 133
    gds_datatype: 0
  - name: Metal7
    gds_layer: 134
    gds_datatype: 0
  - name: PrBoundary
    gds_layer: 189
    gds_datatype: 4
